<a href="/destinasi/{{slug}}" class="destination-card {{cardClass}}" data-route>
  <div class="destination-card-image">
    <img src="{{image}}" alt="{{alt}}" class="image-cover" loading="lazy" />
  </div>

  <div class="destination-card-overlay"></div>

  <div class="destination-card-content">
    <span class="destination-card-label">{{category}}</span>

    <h3 class="destination-card-title">{{name}}</h3>

    <p class="destination-card-description">{{excerpt}}</p>

    <span class="destination-card-link">
      Lihat destinasi
      <span aria-hidden="true">→</span>
    </span>
  </div>
</a>
