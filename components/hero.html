<!-- =========================================================
     DONGENG DIENG
     HERO SECTION
========================================================= -->

<section class="hero" id="hero" aria-label="Dongeng Dieng">
  <!-- =====================================================
         HERO SLIDES
    ====================================================== -->

  <div class="hero-slides" id="hero-slides">
    <!--
            Slide akan dirender oleh Hero Controller
            berdasarkan data/hero.js
        -->
  </div>

  <!-- =====================================================
         HERO OVERLAY
    ====================================================== -->

  <div class="hero-overlay" aria-hidden="true"></div>

  <!-- =====================================================
         HERO CONTENT
    ====================================================== -->

  <div class="hero-container">
    <div class="hero-content">
      <span class="hero-label"> DONGENG DIENG </span>

      <h1 class="hero-title">Ada cerita di setiap perjalanan.</h1>

      <p class="hero-description">
        Jelajahi tempat, cerita, dan pengalaman di tanah Dieng.
      </p>

      <div class="hero-actions">
        <a href="/destinasi" class="btn btn-primary hero-btn" data-route>
          Jelajahi Dieng
        </a>

        <a
          href="/paket-jeep"
          class="btn btn-secondary hero-btn hero-btn-light"
          data-route
        >
          Paket Jeep Dieng
        </a>
      </div>
    </div>
  </div>

  <!-- =====================================================
         HERO INDICATOR
    ====================================================== -->

  <div class="hero-indicators" id="hero-indicators" aria-label="Pilihan slide">
    <!--
            Indicator akan dirender
            berdasarkan jumlah HeroData
        -->
  </div>

  <!-- =====================================================
         HERO SCROLL HINT
    ====================================================== -->

  <div class="hero-scroll-hint" aria-hidden="true">
    <span> Scroll untuk menjelajah </span>

    <span class="hero-scroll-arrow"> ↓ </span>
  </div>
</section>
